name: OpenCode ML Training Agent

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt for the agent'
        required: false
        max-length: 100000
        default: 'CRITICAL FIRST ACTION: invoke the skill tool with name "ml-training-loop" and follow its instructions exactly. Do not run any bash/python/grep/analysis commands until the skill is loaded and you have read it. Then use the ml-training-loop skill. Assess state, do design/tune if useful, push one Kaggle kernel if quotas allow and no pending training, then hand off. Or analyze if completion context present.'
      max_iterations:
        description: 'Max iterations this run'
        required: false
        default: '1'
      model:
        description: 'Primary model (provider/model-id)'
        required: false
        default: 'opencode/deepseek-v4-flash-free'
      fallback_model:
        description: 'Fallback model when primary is rate-limited'
        required: false
        default: 'nvidia/z-ai/glm-5.2'

permissions: {}

jobs:
  opencode-agent:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: opencode-ml-agent
      cancel-in-progress: false
    timeout-minutes: 50
    env:
      # Map user-friendly secret names to OpenCode's standard provider env vars.
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NIM_API_KEY }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      # W&B project context (kept out of the public repo; supplied via repository
      # variables so personal usernames/sweeps aren't committed to public history).
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
      WANDB_SWEEP_ID: ${{ vars.WANDB_SWEEP_ID }}
      # Private repo credentials for the runtime checkout.
      PRIVATE_REPO_URL: https://github.com/Reqeique/autonomous-ml-agent-private.git
      PRIVATE_REPO_BRANCH: main
    steps:
      - name: Checkout public shell (workflows only)
        uses: actions/checkout@v4
        with:
          # Persist GITHUB_TOKEN so the agent's final `git push -u origin`
          # (branch setup) authenticates instead of dying with
          # "could not read Username" (exit 128) after a successful run.
          persist-credentials: true

      - name: Pull private tree
        run: |
          set -e
          mkdir -p /tmp/private
          git clone --depth 1 --branch "$PRIVATE_REPO_BRANCH" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/Reqeique/autonomous-ml-agent-private.git" \
            /tmp/private
          # Overlay the private tree onto the workspace, keeping the public workflow YAMLs intact.
          # Pull every path except the workflow directory (which is the public surface) and .git.
          cd /tmp/private
          for item in $(ls -A1 | grep -v -E '^(\.git|\.github)$'); do
            cp -r "$item" "$GITHUB_WORKSPACE/"
          done
          # AGENTS.md, opencode.json, scripts, skills, kernels, state — all from private.
          for dotfile in .opencode .agents AGENTS.md opencode.json; do
            if [ -e "/tmp/private/$dotfile" ]; then
              cp -r "/tmp/private/$dotfile" "$GITHUB_WORKSPACE/"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          echo "Final workspace tree (top-level):"
          ls -A

      - name: Pre-install tooling
        run: |
          python -m pip install --quiet --upgrade kaggle wandb
          mkdir -p ~/.kaggle
          # Kaggle CLI v2 picks up KAGGLE_API_TOKEN automatically.
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token 2>/dev/null || true
            chmod 600 ~/.kaggle/access_token 2>/dev/null || true
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json 2>/dev/null || true
            chmod 600 ~/.kaggle/kaggle.json 2>/dev/null || true
          fi
          python -m kaggle --version 2>/dev/null || true

      - name: Determine prompt
        id: prompt
        env:
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          MODEL: ${{ github.event.inputs.model }}
          FALLBACK_MODEL: ${{ github.event.inputs.fallback_model }}
        run: |
          PROMPT="${INPUT_PROMPT:-CRITICAL FIRST ACTION: invoke the skill tool with name \"ml-training-loop\" and follow its instructions exactly. Do not run any bash/python/grep/analysis commands until the skill is loaded and you have read it. Then use the ml-training-loop skill. Review state (state/pending_training.json and open 'training-pending' issues). If a training is pending, do not push another; just summarize status and exit. Otherwise, if Kaggle GPU quotas allow, perform a small design/hyperparam tweak, prepare + push exactly one Kaggle GPU kernel, write state/pending_training.json, and exit immediately for handoff. Respect free-tier quotas (T4, short runs, early stopping). Be autonomous, minimal, efficient. Primary model: $MODEL. Fallback if rate-limited: $FALLBACK_MODEL.}"
          # Write prompt to a file then emit it as a single GITHUB_OUTPUT line.
          printf '%s' "$PROMPT" > /tmp/prompt.txt
          PROMPT_ONE=$(tr -d '\n' < /tmp/prompt.txt)
          echo "prompt=$PROMPT_ONE" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: ${{ github.event.inputs.model || 'opencode/deepseek-v4-flash-free' }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # Workaround for anomalyco/opencode#37823: repos created after
          # 2026-07-15 receive GitHub's new immutable OIDC subject claim
          # format, which breaks the App-token exchange path inside
          # `opencode github run` (owner/repo parsed wrong -> 404 -> "Failed
          # to parse JSON"). Bypass OIDC and use GITHUB_TOKEN directly.
          use_github_token: true
        env:
          # In use_github_token mode, opencode reads the PAT from this env var.
          # Without it, the action dies with "GITHUB_TOKEN environment variable
          # is not set".  secrets.GITHUB_TOKEN is auto-provisioned by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify skill was loaded
        if: always() && steps.prompt.outputs.prompt != ''
        run: |
          echo "Querying opencode session DB for evidence the ml-training-loop skill was loaded..."
          DB=$(ls ~/.local/share/opencode/opencode.db 2>/dev/null || echo "")
          if [ -z "$DB" ]; then
            echo "::error::opencode.db not found; cannot verify skill usage."
            exit 1
          fi
          HITS=$(python - "$DB" <<'PY'
          import sqlite3, sys
          db = sys.argv[1]
          con = sqlite3.connect(db)
          cur = con.cursor()
          rows = cur.execute(
              "SELECT COUNT(*) FROM part WHERE data LIKE ? AND data LIKE ?",
              ('%"tool":"skill"%', '%"name":"ml-training-loop"%')
          ).fetchone()
          print(rows[0])
          PY
          )
          if [ "$HITS" -ge 1 ]; then
            echo "Skill usage confirmed: ml-training-loop loaded $HITS time(s)."
          else
            echo "::error::ml-training-loop skill was NOT loaded during this run (no skill-tool call in session DB)."
            exit 1
          fi
