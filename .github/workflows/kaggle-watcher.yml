name: Kaggle Training Watcher

on:
  schedule:
    # Offset twin entries: GitHub's cron queue is best-effort and can delay
    # (5-30 min) or skip slots under load. Running on the :00 and :02 marks
    # means a delayed/skipped primary slot is still caught by its twin within
    # a couple of minutes. The watcher is idempotent (state-driven), so the
    # overlap is harmless. */5 is GitHub's minimum interval.
    - cron: '*/5 * * * *'
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    concurrency:
      group: kaggle-watcher
      cancel-in-progress: false
    env:
      PRIVATE_REPO_URL: https://github.com/Reqeique/autonomous-ml-agent-private.git
      PRIVATE_REPO_BRANCH: main
    steps:
      - name: Checkout public shell (workflows + state only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pull private tree
        run: |
          set -e
          git clone --depth 1 --branch "$PRIVATE_REPO_BRANCH" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/Reqeique/autonomous-ml-agent-private.git" \
            /tmp/private
          cd /tmp/private
          for item in $(ls -A1 | grep -v -E '^(\.git|\.github)$'); do
            cp -r "$item" "$GITHUB_WORKSPACE/"
          done
          for dotfile in .opencode .agents AGENTS.md opencode.json; do
            if [ -e "/tmp/private/$dotfile" ]; then
              cp -r "/tmp/private/$dotfile" "$GITHUB_WORKSPACE/"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          echo "Workspace ready."

      - name: Setup Kaggle
        run: |
          python -m pip install --quiet --upgrade kaggle
          mkdir -p ~/.kaggle
          if [ -n "${{ secrets.KAGGLE_API_TOKEN }}" ]; then
            printf '%s' "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          else
            printf '{"username":"%s","key":"%s"}' "${{ secrets.KAGGLE_USERNAME }}" "${{ secrets.KAGGLE_KEY }}" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi

      - name: Inspect state and kernel status
        id: check
        env:
          PENDING_FILE: state/pending_training.json
        run: |
          set -e
          echo "Looking for $PENDING_FILE"
          if [ ! -f "$PENDING_FILE" ]; then
            echo "No pending training state."
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_pending=true" >> "$GITHUB_OUTPUT"
          KERNEL=$(jq -r '.kernel // .kernel_slug // empty' "$PENDING_FILE")
          ITER=$(jq -r '.iteration // .iter // 0' "$PENDING_FILE")
          GOAL=$(jq -r '.goal // ""' "$PENDING_FILE")
          WANDB=$(jq -r '.wandb_run // empty' "$PENDING_FILE")
          PUSHED_AT=$(jq -r '.pushed_at // ""' "$PENDING_FILE")
          if [ -z "$KERNEL" ]; then
            echo "::error::pending_training.json missing 'kernel' field"
            exit 1
          fi
          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "iteration=$ITER" >> "$GITHUB_OUTPUT"
          echo "goal=$GOAL" >> "$GITHUB_OUTPUT"
          echo "wandb_run=$WANDB" >> "$GITHUB_OUTPUT"
          echo "pushed_at=$PUSHED_AT" >> "$GITHUB_OUTPUT"
          echo "--- kaggle kernels status ---"
          STATUS_OUTPUT=$(kaggle kernels status "$KERNEL" 2>&1 || true)
          # Log a short status line only ΓÇö full output may contain identifiers in a public repo.
          STATE_HINT=$(echo "$STATUS_OUTPUT" | tr -d '\n' | head -c 200)
          echo "status: $STATE_HINT"
          echo "status_output<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$STATUS_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$STATUS_OUTPUT" | grep -qiE '\bcomplete\b|\bsuccess\b|\bfinished\b|has completed'; then
            echo "state=complete" >> "$GITHUB_OUTPUT"
          elif echo "$STATUS_OUTPUT" | grep -qiE '\berror\b|\bfailed\b|\bcancelled\b|\bcrash\b'; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
          else
            echo "state=running" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger OpenCode agent on completion or failure
        if: steps.check.outputs.has_pending == 'true' && (steps.check.outputs.state == 'complete' || steps.check.outputs.state == 'failed')
        uses: actions/github-script@v7
        env:
          KERNEL: ${{ steps.check.outputs.kernel }}
          STATE: ${{ steps.check.outputs.state }}
          ITERATION: ${{ steps.check.outputs.iteration }}
          GOAL: ${{ steps.check.outputs.goal }}
          WANDB_RUN: ${{ steps.check.outputs.wandb_run }}
          PUSHED_AT: ${{ steps.check.outputs.pushed_at }}
          STATUS_OUTPUT: ${{ steps.check.outputs.status_output }}
        with:
          script: |
            const payload = {
              kernel: process.env.KERNEL,
              state: process.env.STATE,
              iteration: Number(process.env.ITERATION || 0),
              goal: String(process.env.GOAL).replace(/\n/g, ' '),
              wandb_run: process.env.WANDB_RUN,
              pushed_at: process.env.PUSHED_AT,
              status_output: String(process.env.STATUS_OUTPUT).replace(/\n/g, ' '),
              triggered_by: 'kaggle-watcher',
              timestamp: new Date().toISOString()
            };
            const prompt = `Training-completion notification received. Payload: ${JSON.stringify(payload)}. CRITICAL FIRST ACTION: invoke the skill tool with name "ml-training-loop" and follow its instructions exactly. Do not run any bash/python/grep/analysis commands until the skill is loaded and you have read it. Then, per the skill: Analyze the completed/failed Kaggle kernel (pull status/output, download artifacts), pull W&B metrics via API, decide improvements, edit code, open a PR if valuable, clear pending state (state/pending_training.json) and close related 'training-pending' issues, then summarize with links and W&B run URL. ARCHITECTURE-FIRST: BPC gains must come from architecture (novel PerPos parts), never from inflating epochs / limit_chars / block_size. Find the minimal budget that converges, lock it, and report time-to-convergence. Optionally prepare the next iteration (one push max per invocation). Be token-efficient; do not retrain without good reason.`;
            const inputs = {
              prompt,
              max_iterations: '1',
              model: 'nvidia/z-ai/glm-5.2',
              fallback_model: 'opencode/x-preview-f-free'
            };
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'opencode-ml-agent.yml',
              ref: 'main',
              inputs
            });
            console.log('Dispatched opencode-ml-agent.yml via workflow_dispatch');

      - name: Sync GitHub Issue state (optional)
        if: steps.check.outputs.has_pending == 'true' && (steps.check.outputs.state == 'complete' || steps.check.outputs.state == 'failed')
        uses: actions/github-script@v7
        env:
          KERNEL: ${{ steps.check.outputs.kernel }}
          STATE: ${{ steps.check.outputs.state }}
        with:
          script: |
            const kernel = process.env.KERNEL;
            const state = process.env.STATE;
            const label = 'training-pending';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 50
            });
            const matches = issues.filter(i => i.title.includes(kernel));
            for (const i of matches) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                state: 'closed',
                labels: ['training-pending', `training-${state}`]
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                body: `Watcher detected state=\`${state}\` at ${new Date().toISOString()}. Dispatched opencode-ml-agent.`
              });
            }
