name: OpenCode ML Sweep Agent

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt for the agent'
        required: false
        default: 'Use the ml-sweep-loop skill. Monitor the GPU sweep, detect stagnation, narrow the search space, fold any budget-respecting winner into the canonical config as a PR. Never push Kaggle kernels.'
      max_iterations:
        description: 'Max iterations this run'
        required: false
        default: '1'
      model:
        description: 'Primary model (provider/model-id)'
        required: false
        default: 'nvidia/z-ai/glm-5.2'
      fallback_model:
        description: 'Fallback model when primary is rate-limited'
        required: false
        default: 'opencode/deepseek-v4-flash-free'
  repository_dispatch:
    types: [kaggle-sweep-trigger, ml-agent-trigger]

permissions: {}

jobs:
  opencode-sweep-agent:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: opencode-ml-sweep
      cancel-in-progress: false
    timeout-minutes: 50
    env:
      # Map user-friendly secret names to OpenCode's standard provider env vars.
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NIM_API_KEY }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_API_TOKEN_2: ${{ secrets.KAGGLE_API_TOKEN_2 }}
      KAGGLE_API_TOKEN_3: ${{ secrets.KAGGLE_API_TOKEN_3 }}
      KAGGLE_API_TOKEN_4: ${{ secrets.KAGGLE_API_TOKEN_4 }}
      # W&B project context (kept out of the public repo; supplied via repository
      # variables so personal usernames/sweeps aren't committed to public history).
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
      WANDB_SWEEP_ID: ${{ vars.WANDB_SWEEP_ID }}
      # Private repo credentials for the runtime checkout.
      PRIVATE_REPO_URL: https://github.com/Reqeique/autonomous-ml-agent-private.git
      PRIVATE_REPO_BRANCH: main
    steps:
      - name: Checkout public shell (workflows only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pull private tree
        run: |
          set -e
          mkdir -p /tmp/private
          git clone --depth 1 --branch "$PRIVATE_REPO_BRANCH" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/Reqeique/autonomous-ml-agent-private.git" \
            /tmp/private
          # Overlay the private tree onto the workspace, keeping the
          # public workflow YAMLs intact.
          cd /tmp/private
          for item in $(ls -A1 | grep -v -E '^(\.git|\.github)$'); do
            cp -r "$item" "$GITHUB_WORKSPACE/"
          done
          for dotfile in .opencode .agents AGENTS.md opencode.json; do
            if [ -e "/tmp/private/$dotfile" ]; then
              cp -r "/tmp/private/$dotfile" "$GITHUB_WORKSPACE/"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          echo "Final workspace tree (top-level):"
          ls -A

      - name: Pre-install tooling
        run: |
          python -m pip install --quiet --upgrade kaggle wandb
          mkdir -p ~/.kaggle
          # Kaggle CLI v2 picks up KAGGLE_API_TOKEN automatically.
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token 2>/dev/null || true
            chmod 600 ~/.kaggle/access_token 2>/dev/null || true
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json 2>/dev/null || true
            chmod 600 ~/.kaggle/kaggle.json 2>/dev/null || true
          fi
          python -m kaggle --version 2>/dev/null || true

      - name: Determine prompt
        id: prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MODEL: ${{ github.event.inputs.model }}
          FALLBACK_MODEL: ${{ github.event.inputs.fallback_model }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            PROMPT="Sweep-trigger received. Payload: $PAYLOAD. Use the ml-sweep-loop skill. Monitor the GPU sweep (pull W&B runs, rank by BPC under the committed budget), detect stagnation, steer the search space, fold any budget-respecting winner into the canonical config as a PR, and update state/sweep_state.json. Never push Kaggle kernels. Primary model: $MODEL. Fallback if rate-limited: $FALLBACK_MODEL."
          else
            PROMPT="${INPUT_PROMPT:-Use the ml-sweep-loop skill. Read state/sweep_state.json and state/baseline.json. Pull the W&B sweep runs via the API. Rank by BPC under the committed budget; reject any run that inflated compute. If the sweep is stagnating, narrow sweep_config.json around the best arms, create the successor sweep, update the WANDB_SWEEP_ID repo variable, and open a PR. If the best run beats baseline current_best (1.8833 BPC) under the same budget, open a PR folding the clamped winning config into the canonical configs and update state/baseline.json current_best. Update state/sweep_state.json with fresh metrics. Report with links. Do NOT push Kaggle kernels. Primary model: $MODEL. Fallback if rate-limited: $FALLBACK_MODEL.}"
          fi
          printf '%s' "$PROMPT" > /tmp/prompt.txt
          echo "prompt=$(cat /tmp/prompt.txt)" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: ${{ github.event.inputs.model || 'nvidia/z-ai/glm-5.2' }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # Workaround for anomalyco/opencode#37823: repos created after
          # 2026-07-15 receive GitHub's new immutable OIDC subject claim
          # format, which breaks the App-token exchange path inside
          # `opencode github run`. Bypass OIDC and use GITHUB_TOKEN directly.
          use_github_token: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
